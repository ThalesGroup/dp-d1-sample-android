plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

def modulesProperties = new Properties()
modulesProperties.load(new FileInputStream(rootProject.file("modules.properties")))

android {
    namespace 'com.thalesgroup.d1.templates'

    defaultConfig {
        applicationId "com.thalesgroup.d1.templates"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        compileSdkVersion libs.versions.compileSdk.get().toInteger()

        versionCode 40501
        versionName "4.5.1"
    }

    signingConfigs {
        def keystoreProperties = new Properties()
        keystoreProperties.load(new FileInputStream(rootProject.file("app/keystore/keystore.properties")))

        thalesSandbox {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }

    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.thalesSandbox
        }

        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.thalesSandbox
        }
    }

    flavorDimensions "sample"
    productFlavors {
        pushProvisioning {
            dimension "sample"
            missingDimensionStrategy "pay", "pushProvisioning"
        }

        nfcPayment {
            dimension "sample"
            missingDimensionStrategy "pay", "nfcPayment"
        }
    }

    sourceSets{

        pushProvisioning {
            java.srcDirs = [ 'src/pushProvisioning/java']
            res.srcDirs = ['src/pushProvisioning/res']
        }

        nfcPayment {
            java.srcDirs = ['src/nfcPayment/java']
            res.srcDirs = ['src/nfcPayment/res']
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        dataBinding true
        viewBinding true
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.multidex
    implementation libs.localbroadcastmanager

    implementation project(':core')
    implementation project(':features:pay')
    implementation project(':features:virtualcard')
    implementation project(':features:push')
    implementation project(':features:physicalcard')
    implementation project(':features:clicktopay')

    debugImplementation project(":libs:d1-debug")
    releaseImplementation project(":libs:d1-release")

    // Do not update to later versions. JNA 5.5 AAR is required.
    implementation(libs.jna) { artifact { type = 'aar' } }

    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging

    // Starting from SDK 4.4.0
    implementation files('libs/samsungpay_2.22.00.jar')

    //Starting from SDK 4.5.0
    implementation files("libs/play-services-tapandpay-18.7.0.aar")
    implementation 'com.google.android.gms:play-services-basement:18.7.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}